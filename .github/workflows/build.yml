name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works both ways: project files uploaded directly, OR a .zip uploaded to the repo root
      # (any zip name, spaces allowed, newest zip is used, extra top-level folder is fine)
      - name: Find project (unzip if needed)
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "Project files found in repo root"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi
          ZIP="$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: no settings.gradle and no .zip in repo root. Files:"
            ls -la
            exit 1
          fi
          echo "Using zip: $ZIP"
          mkdir -p _proj
          unzip -q -o "$ZIP" -d _proj
          SETTINGS="$(find _proj \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/__MACOSX/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: zip has no settings.gradle. Contents:"
            find _proj -maxdepth 3 | head -50
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # api.xposed.info is sometimes down, so retry up to 3 times
      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          for i in 1 2 3; do
            gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log" && break
            echo "Attempt $i failed, retrying in 15s"
            sleep 15
          done
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicPill-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
