name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -t IOSConnectCluster*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "IOSConnectCluster*.zip repo me nahi mila"; ls -la; exit 1; fi
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 3 -name settings.gradle | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle zip me nahi mila"; find _src | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: IOSConnectCluster-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
